<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Portal de Atividades — Professor Thiago</title> <style> body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#222} .box{max-width:900px;margin:auto;background:white;padding:20px;border-radius:16px} h1{margin-top:0;color:#123} .card{border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:16px;background:white} button{padding:12px 16px;border:0;border-radius:10px;background:#1a73e8;color:white;font-weight:bold;margin:6px 4px 6px 0;cursor:pointer} button.sec{background:#555} input,select{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #aaa;font-size:16px;box-sizing:border-box} label{display:block;background:#f1f3f4;padding:10px;border-radius:10px;margin:8px 0} table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px} th,td{border:1px solid #ddd;padding:8px;text-align:left} th{background:#eef3ff} .hidden{display:none} .ok{color:green;font-weight:bold} .erro{color:#b00020;font-weight:bold} .small{font-size:13px;color:#555} .print{white-space:pre-wrap;background:#f8fbff;border:2px dashed #1a73e8;line-height:1.5} .top{display:flex;gap:8px;flex-wrap:wrap} </style> </head> <body> <div class="box"> <h1>Portal de Atividades — Professor Thiago</h1> <p><strong>Escola:</strong> CIEP Doutor Ernesto Che Guevara</p> <p><strong>Status:</strong> <span id="status">Carregando...</span></p> <div class="top"> <button onclick="abrirArea('aluno')">Sou aluno</button> <button class="sec" onclick="abrirArea('professor')">Sou professor</button> </div> <div id="areaAluno" class="card"> <h2>Área do aluno</h2> <label>Turma</label> <select id="turmaAluno" onchange="atualizarAtividadesAluno()"></select> <label>Código do aluno</label> <input id="codigoAluno" placeholder="Exemplo: 50119"> <label>Atividade</label> <select id="atividadeAluno"></select> <button onclick="entrarAluno()">Entrar na atividade</button> <p id="msgAluno"></p> </div> <div id="areaQuiz" class="card hidden"> <h2 id="nomeAluno"></h2> <p id="nomeAtividade"></p> <div id="questoes"></div> <button onclick="enviarRespostas()">Enviar respostas</button> </div> <div id="resultadoAluno" class="card hidden"></div> <div id="areaProfessor" class="card hidden"> <h2>Área do professor</h2> <label>Turma</label> <select id="turmaProfessor" onchange="atualizarAtividadesProfessor()"></select> <label>Atividade</label> <select id="atividadeProfessor"></select> <button onclick="carregarResultados()">Ver resultados</button> <button onclick="gerarResumo()">Resumo para print</button> <button onclick="baixarCSV()">Baixar CSV</button> <div id="resumoPrint" class="card print hidden"></div> <div id="painelResultados"></div> </div> </div> <script> const SB_URL = "https://aabdxrputomvnrwfevvx.supabase.co/rest/v1/"; const SB_KEY = "sb_publishable_MkhvW-SAXcNs2tCP4LA3wA_PMMvOlLv"; const HEADERS = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" }; let alunos = []; let atividades = []; let questoesAtuais = []; let alunoAtual = null; let atividadeAtual = null; let inicio = null; let resultadosAtuais = []; function abrirArea(area){ document.getElementById("areaAluno").classList.toggle("hidden", area !== "aluno"); document.getElementById("areaProfessor").classList.toggle("hidden", area !== "professor"); document.getElementById("areaQuiz").classList.add("hidden"); document.getElementById("resultadoAluno").classList.add("hidden"); } function escapeHtml(txt){ return String(txt || "") .replaceAll("&","&amp;") .replaceAll("<","&lt;") .replaceAll(">","&gt;") .replaceAll('"',"&quot;") .replaceAll("'","&#039;"); } async function apiGet(caminho){ const r = await fetch(SB_URL + caminho, {headers: HEADERS}); if(!r.ok) throw new Error(await r.text()); return await r.json(); } async function apiPost(tabela, dados){ const r = await fetch(SB_URL + tabela, { method:"POST", headers:{...HEADERS, "Prefer":"return=minimal"}, body:JSON.stringify(dados) }); if(!r.ok) throw new Error(await r.text()); } async function iniciar(){ try{ alunos = await apiGet("alunos?select=*&ativo=eq.true&order=turma.asc,numero_chamada.asc"); atividades = await apiGet("atividades?select=*&ativa=eq.true&order=turma.asc,criado_em.desc"); const turmas = [...new Set([ ...alunos.map(a => a.turma), ...atividades.map(a => a.turma) ])].sort(); preencherSelect("turmaAluno", turmas); preencherSelect("turmaProfessor", turmas); atualizarAtividadesAluno(); atualizarAtividadesProfessor(); document.getElementById("status").innerHTML = "<span class='ok'>online conectado ao Supabase</span> — " + alunos.length + " alunos | " + atividades.length + " atividade(s)"; }catch(e){ document.getElementById("status").innerHTML = "<span class='erro'>erro de conexão</span>"; alert("Erro ao carregar dados: " + e.message); } } function preencherSelect(id, lista){ const sel = document.getElementById(id); sel.innerHTML = ""; lista.forEach(item => { const op = document.createElement("option"); op.value = item; op.textContent = item; sel.appendChild(op); }); } function atividadesDaTurma(turma){ return atividades.filter(a => a.turma === turma); } function atualizarAtividadesAluno(){ const turma = document.getElementById("turmaAluno").value; preencherAtividades("atividadeAluno", atividadesDaTurma(turma)); } function atualizarAtividadesProfessor(){ const turma = document.getElementById("turmaProfessor").value; preencherAtividades("atividadeProfessor", atividadesDaTurma(turma)); } function preencherAtividades(id, lista){ const sel = document.getElementById(id); sel.innerHTML = ""; lista.forEach(a => { const op = document.createElement("option"); op.value = a.id; op.textContent = a.titulo; sel.appendChild(op); }); } async function entrarAluno(){ const turma = document.getElementById("turmaAluno").value; const codigo = document.getElementById("codigoAluno").value.trim(); const atividadeId = document.getElementById("atividadeAluno").value; const msg = document.getElementById("msgAluno"); alunoAtual = alunos.find(a => a.codigo === codigo && a.turma === turma); atividadeAtual = atividades.find(a => a.id === atividadeId); if(!alunoAtual){ msg.innerHTML = "<span class='erro'>Código não encontrado nesta turma.</span>"; return; } if(!atividadeAtual){ msg.innerHTML = "<span class='erro'>Nenhuma atividade disponível.</span>"; return; } questoesAtuais = await apiGet("questoes?select=*&atividade_id=eq." + atividadeId + "&order=numero.asc"); if(!questoesAtuais.length){ msg.innerHTML = "<span class='erro'>Atividade sem questões cadastradas.</span>"; return; } inicio = new Date(); document.getElementById("areaAluno").classList.add("hidden"); document.getElementById("resultadoAluno").classList.add("hidden"); document.getElementById("areaQuiz").classList.remove("hidden"); document.getElementById("nomeAluno").textContent = alunoAtual.nome + " — " + alunoAtual.codigo; document.getElementById("nomeAtividade").innerHTML = "<strong>Atividade:</strong> " + escapeHtml(atividadeAtual.titulo); montarQuestoes(); } function montarQuestoes(){ const div = document.getElementById("questoes"); div.innerHTML = ""; questoesAtuais.forEach(q => { let html = ""; html += "<div class='card'>"; html += "<h3>Questão " + q.numero + "</h3>"; html += "<p>" + escapeHtml(q.enunciado) + "</p>"; if(q.imagem_url){ html += "<img src='" + escapeHtml(q.imagem_url) + "' style='max-width:100%;border-radius:12px'>"; if(q.legenda_imagem) html += "<p class='small'>" + escapeHtml(q.legenda_imagem) + "</p>"; } html += alternativa(q.id, "A", q.alternativa_a); html += alternativa(q.id, "B", q.alternativa_b); html += alternativa(q.id, "C", q.alternativa_c); html += alternativa(q.id, "D", q.alternativa_d); html += "</div>"; div.innerHTML += html; }); } function alternativa(id, letra, texto){ if(!texto) return ""; return "<label><input type='radio' name='q" + id + "' value='" + letra + "'> " + letra + ") " + escapeHtml(texto) + "</label>"; } async function enviarRespostas(){ let acertos = 0; let erradas = []; let respostas = {}; let habilidadesErradas = []; questoesAtuais.forEach(q => { const marcada = document.querySelector("input[name='q" + q.id + "']:checked"); const resp = marcada ? marcada.value : ""; respostas[q.numero] = resp; if(resp === q.correta){ acertos++; }else{ erradas.push(q.numero); if(q.habilidade) habilidadesErradas.push(q.habilidade); } }); const fim = new Date(); const tempo = Math.round((fim - inicio) / 1000); const nota = Number((acertos / questoesAtuais.length * 10).toFixed(1)); const registro = { atividade_id: atividadeAtual.id, aluno_codigo: alunoAtual.codigo, respostas: respostas, acertos: acertos, erros: erradas.length, nota: nota, tempo_segundos: tempo, questoes_erradas: erradas.join(", "), habilidades_erradas: [...new Set(habilidadesErradas)].join(", ") }; try{ await apiPost("resultados", registro); document.getElementById("areaQuiz").classList.add("hidden"); document.getElementById("resultadoAluno").classList.remove("hidden"); document.getElementById("resultadoAluno").innerHTML = "<h2>Respostas enviadas</h2>" + "<p><strong>" + escapeHtml(alunoAtual.nome) + "</strong>, suas respostas foram registradas online.</p>" + "<p>Acertos: <strong>" + acertos + "</strong> de " + questoesAtuais.length + "</p>" + "<p>Nota: <strong>" + nota + "</strong></p>"; }catch(e){ alert("Erro ao salvar respostas: " + e.message); } } async function carregarResultados(){ const atividadeId = document.getElementById("atividadeProfessor").value; atividadeAtual = atividades.find(a => a.id === atividadeId); if(!atividadeAtual){ document.getElementById("painelResultados").innerHTML = "<p>Nenhuma atividade selecionada.</p>"; return; } const todos = await apiGet("resultados?select=*&atividade_id=eq." + atividadeId + "&order=enviado_em.desc"); const ultimos = {}; todos.forEach(r => { if(!ultimos[r.aluno_codigo]) ultimos[r.aluno_codigo] = r; }); resultadosAtuais = Object.values(ultimos); if(!resultadosAtuais.length){ document.getElementById("painelResultados").innerHTML = "<p>Nenhum resultado ainda.</p>"; return; } let html = "<table><tr><th>Aluno</th><th>Código</th><th>Acertos</th><th>Nota</th><th>Erros</th><th>Data</th></tr>"; resultadosAtuais.forEach(r => { const aluno = alunos.find(a => a.codigo === r.aluno_codigo); html += "<tr>"; html += "<td>" + escapeHtml(aluno ? aluno.nome : "") + "</td>"; html += "<td>" + escapeHtml(r.aluno_codigo) + "</td>"; html += "<td>" + r.acertos + "</td>"; html += "<td>" + r.nota + "</td>"; html += "<td>" + escapeHtml(r.questoes_erradas || "") + "</td>"; html += "<td>" + new Date(r.enviado_em).toLocaleString("pt-BR") + "</td>"; html += "</tr>"; }); html += "</table>"; document.getElementById("painelResultados").innerHTML = html; } function gerarResumo(){ const div = document.getElementById("resumoPrint"); div.classList.remove("hidden"); if(!resultadosAtuais.length){ div.innerText = "Nenhum resultado carregado. Clique primeiro em Ver resultados."; return; } const turma = document.getElementById("turmaProfessor").value; const alunosTurma = alunos.filter(a => a.turma === turma); const media = resultadosAtuais.reduce((s,r) => s + Number(r.nota), 0) / resultadosAtuais.length; let errosQuestoes = {}; let errosHabilidades = {}; let atencao = []; resultadosAtuais.forEach(r => { if(Number(r.nota) < 6){ const aluno = alunos.find(a => a.codigo === r.aluno_codigo); atencao.push((aluno ? aluno.nome : r.aluno_codigo) + " — " + r.nota); } String(r.questoes_erradas || "").split(",").map(x => x.trim()).filter(Boolean).forEach(q => { errosQuestoes[q] = (errosQuestoes[q] || 0) + 1; }); String(r.habilidades_erradas || "").split(",").map(x => x.trim()).filter(Boolean).forEach(h => { errosHabilidades[h] = (errosHabilidades[h] || 0) + 1; }); }); const topQ = Object.entries(errosQuestoes).sort((a,b) => b[1] - a[1]).slice(0,5); const topH = Object.entries(errosHabilidades).sort((a,b) => b[1] - a[1]).slice(0,5); let texto = ""; texto += "RESUMO PARA ANÁLISE — CHATGPT\n\n"; texto += "Turma: " + turma + "\n"; texto += "Atividade: " + atividadeAtual.titulo + "\n"; texto += "Alunos cadastrados: " + alunosTurma.length + "\n"; texto += "Responderam: " + resultadosAtuais.length + "\n"; texto += "Não responderam: " + (alunosTurma.length - resultadosAtuais.length) + "\n"; texto += "Média da turma: " + media.toFixed(1) + "\n\n"; texto += "QUESTÕES COM MAIS ERROS:\n"; if(topQ.length) topQ.forEach(([q,n]) => texto += "Q" + q + " — " + n + " erro(s)\n"); else texto += "Nenhuma questão errada.\n"; texto += "\nHABILIDADES COM MAIS ERROS:\n"; if(topH.length) topH.forEach(([h,n]) => texto += h + " — " + n + " erro(s)\n"); else texto += "Nenhuma habilidade com erro.\n"; texto += "\nALUNOS EM ATENÇÃO:\n"; texto += atencao.length ? atencao.join("\n") : "Nenhum aluno abaixo de 6,0."; div.innerText = texto; } function baixarCSV(){ if(!resultadosAtuais.length){ alert("Carregue os resultados primeiro."); return; } const linhas = ["turma,atividade,codigo,nome,acertos,nota,questoes_erradas,habilidades_erradas,data"]; resultadosAtuais.forEach(r => { const aluno = alunos.find(a => a.codigo === r.aluno_codigo); linhas.push([ aluno ? aluno.turma : "", atividadeAtual.titulo, r.aluno_codigo, aluno ? aluno.nome : "", r.acertos, r.nota, '"' + (r.questoes_erradas || "") + '"', '"' + (r.habilidades_erradas || "") + '"', new Date(r.enviado_em).toLocaleString("pt-BR") ].join(",")); }); const blob = new Blob([linhas.join("\n")], {type:"text/csv;charset=utf-8"}); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = "resultados_portal_atividades.csv"; a.click(); } window.onerror = function(msg){ document.getElementById("status").innerHTML = "<span class='erro'>Erro no site: " + msg + "</span>"; }; iniciar(); </script> </body> </html>
